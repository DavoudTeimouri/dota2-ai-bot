name: Lua Lint (luacheck)

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  luacheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Luacheck
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 luarocks
          sudo luarocks install luacheck

      - name: Run luacheck on vscripts/bots
        run: |
          luacheck --config .luacheckrc vscripts/bots/
